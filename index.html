<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة القيم | Values Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FB;--card:#fff;--ink:#17213B;--mut:#58637F;--pri:#3B4CCA;--on:#fff;--acc:#0E9F8E;--ln:#D5DCEE;--soft:#E8ECFA;--warn:#C2410C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1527;--card:#182041;--ink:#EEF1FB;--mut:#A6B0CE;--pri:#8E9BFF;--on:#0F1527;--acc:#3DD6C3;--ln:#2C3768;--soft:#222C57;--warn:#FDBA74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1527;--card:#182041;--ink:#EEF1FB;--mut:#A6B0CE;--pri:#8E9BFF;--on:#0F1527;--acc:#3DD6C3;--ln:#2C3768;--soft:#222C57;--warn:#FDBA74;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 Cairo,Tahoma,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
header b{font-weight:800;font-size:19px;white-space:nowrap}
.pg{flex:1;height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
#bar{height:100%;width:0;background:var(--acc);border-radius:9px;transition:width .5s}
#lab{font-size:14px;color:var(--mut);white-space:nowrap}
main{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:24px 22px}
h2{font-size:26px;line-height:1.5;margin:0 0 6px;font-weight:800;outline:none}
h3{font-size:19px;margin:22px 0 6px}
p{margin:.4em 0 1em;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:16px 0}
.vc{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:14px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:transform .15s,border-color .15s,background .15s}
.vc b{font-size:19px;line-height:1.5}
.vc span{font-size:13px;color:var(--mut);direction:ltr}
.vc[aria-pressed="true"]{border-color:var(--pri);background:var(--soft);transform:scale(1.04)}
.vc:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.btn{font:700 17px Cairo,Tahoma,sans-serif;background:var(--pri);color:var(--on);border:0;border-radius:12px;padding:8px 26px;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.msg{min-height:28px;color:var(--warn);font-weight:700;margin:0}
.hero{background:var(--pri);color:var(--on);border-radius:16px;padding:18px 20px;animation:pop .6s}
.hero p{color:inherit;margin:.3em 0 0}
.hero strong{display:block;font-size:30px;line-height:1.5}
.hero em{font-size:16px;font-style:normal;opacity:.85;direction:ltr;unicode-bidi:isolate}
ul{padding:0 20px;margin:0}
li{margin:6px 0}
textarea{width:100%;min-height:84px;font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--ln);border-radius:12px;padding:10px;resize:vertical}
.note{font-size:14px;color:var(--mut)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><b>رحلة القيم</b><div class="pg" role="progressbar" aria-label="التقدم"><div id="bar"></div></div><span id="lab"></span></header>
<main id="app"></main>
</div>
<script>
const V=[
['الصدق','Honesty','إنك تقول الحقيقة حتى لو كانت صعبة','بتختار الوضوح حتى لو هيزعّل حد'],
['المسؤولية','Responsibility','إنك تتحمل نتيجة اختياراتك','بتخلّص اللي وعدت بيه قبل ما تبدأ في حاجة جديدة'],
['القيادة','Leadership','إنك تشجع غيرك وتوجّه الفريق للهدف','بتاخد المبادرة لما محدش بيتحرك'],
['التعاطف','Empathy','إنك تحس بغيرك وتفهم موقفه','بتسأل «هو حاسس بإيه؟» قبل ما تحكم'],
['الإبداع','Creativity','إنك تفكر بطرق جديدة','بتدوّر على حل مختلف عن المعتاد'],
['الاحترام','Respect','إنك تقدّر الناس واختلافهم','بتسمع للطرف التاني حتى لو مش متفق معاه'],
['الالتزام','Commitment','إنك تلتزم بكلامك ومواعيدك','بتقول «لأ» للي مش هتقدر تنفذه'],
['النمو','Growth','إنك تتطور باستمرار','بتختار الفرصة اللي هتعلّمك حتى لو أصعب'],
['التعاون','Cooperation','إنك تشتغل مع غيرك لهدف مشترك','بتفضّل نجاح الفريق على نجاحك لوحدك'],
['الإنجاز','Achievement','إنك توصل لنتيجة تفتخر بيها','بتحط هدف واضح وتتابعه لحد ما يخلص'],
['الاستقلالية','Independence','إنك تعتمد على نفسك وتاخد قرارك','بتفكر بنفسك قبل ما تاخد رأي الناس'],
['العدل','Justice','إنك تعامل الناس بإنصاف','بتقف مع الحق حتى لو مش في مصلحتك'],
['الأسرة','Family','إنك تحافظ على قربك من أهلك','بتوازن وقتك علشان أهلك ليهم نصيب'],
['التعلّم','Learning','إنك تفضل فضولي وتسأل','بتجرب حاجة جديدة وتتقبل إنك ممكن تغلط'],
['الخدمة','Service','إنك تفيد الناس والمجتمع','بتدّي وقتك لحد محتاج من غير مقابل'],
['الشجاعة','Courage','إنك تتصرف رغم الخوف','بتتكلم وتجرب حتى لو خايف'],
['التوازن','Balance','إنك تظبط بين الدراسة والتطوع والراحة','بتحمي وقت راحتك علشان تكمل'],
['الكرم','Generosity','إنك تدّي من وقتك وخبرتك','بتشارك اللي تعرفه من غير ما تستنى مقابل']
];
let st=0,sel=[],th=[],tp=null,msg='';
const app=document.getElementById('app'),bar=document.getElementById('bar'),lab=document.getElementById('lab');
const grid=(list,pick)=>'<div class="grid">'+list.map(i=>`<button class="vc" aria-pressed="${pick.includes(i)}" data-i="${i}"><b>${V[i][0]}</b><span>${V[i][1]}</span></button>`).join('')+'</div>';
const nav=(back,ok,label)=>`<div class="nav">${back?'<button class="btn ghost" data-a="back">رجوع</button>':'<span></span>'}<button class="btn" data-a="next" ${ok?'':'disabled'}>${label}</button></div>`;
function render(f){
  bar.style.width=(st/4*100)+'%';
  lab.textContent=st?`الخطوة ${st} من 4`:'البداية';
  let h='';
  if(st===0){
    h=`<h2 tabindex="-1">إيه اللي بيحرّك قراراتك؟</h2><p>القيم هي البوصلة اللي بنختار بيها وقت ما الاختيارات تصعب. في الرحلة دي هتختار، وتضيّق، وتحدد أهم قيمة عندك. مفيش إجابة صح أو غلط، ومفيش بيانات بتتسجل.</p>
    <div class="nav"><span></span><button class="btn" data-a="next">ابدأ الرحلة</button></div>`;
  }else if(st===1){
    h=`<h2 tabindex="-1">اختار 5 قيم بتمثّلك</h2><p>اختار القيم اللي بتحس إنها بتوصفك فعلًا، مش اللي بتتمنى تبان بيها. تم اختيار <b>${sel.length}</b> من 5.</p>${grid(V.map((_,i)=>i),sel)}<p class="msg" role="status">${msg}</p>${nav(true,sel.length===5,'التالي')}`;
  }else if(st===2){
    h=`<h2 tabindex="-1">ضيّقها لـ 3 قيم</h2><p>تخيّل إنك لازم تتخلى عن اتنين منهم. اختار 3 بس. تم اختيار <b>${th.length}</b> من 3.</p>${grid(sel,th)}<p class="msg" role="status">${msg}</p>${nav(true,th.length===3,'التالي')}`;
  }else if(st===3){
    h=`<h2 tabindex="-1">إيه أهم قيمة عندك؟</h2><p>لو القيم التلاتة اتعارضوا في موقف واحد، أنهي واحدة هتكسب؟</p>${grid(th,tp===null?[]:[tp])}${nav(true,tp!==null,'شوف ملخصي')}`;
  }else{
    const t=V[tp],o=V[th.find(i=>i!==tp)];
    h=`<h2 tabindex="-1">ملخص رحلتك</h2>
    <div class="hero"><p>قيمتك الأهم</p><strong>${t[0]} <em>${t[1]}</em></strong><p>${t[1]} يعني ${t[2]}. وده بيأثر على قراراتك كده: ${t[3]}.</p></div>
    <h3>قيمك التلاتة</h3><ul>${th.map(i=>`<li><b>${V[i][0]}</b> (${V[i][1]}): ${V[i][2]}</li>`).join('')}</ul>
    <h3>أسئلة للتأمل</h3>
    <p>1) فكّر في موقف في الجامعة أو التطوع اتعارضت فيه «${t[0]}» مع «${o[0]}». إيه اللي اخترته وليه؟</p><textarea aria-label="إجابة السؤال الأول"></textarea>
    <p>2) قيمك ممكن تفيد فريق التطوع إزاي؟ وإيه اللي ممكن يحصل لو قيمة فريقك بتختلف عن قيمتك؟</p><textarea aria-label="إجابة السؤال الثاني"></textarea>
    <p class="note">ده نشاط للتأمل الشخصي ومش اختبار علمي. إجاباتك بتفضل على جهازك ومش بتتسجل في أي مكان. ممكن تتغير قيمك مع الوقت.</p>
    <div class="nav"><button class="btn ghost" data-a="back">رجوع</button><button class="btn" data-a="restart">ابدأ من جديد</button></div>`;
  }
  app.innerHTML=h;
  const el=f!=null&&app.querySelector(`[data-i="${f}"]`);
  (el||app.querySelector('h2')).focus({preventScroll:f!=null});
}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a){
    msg='';
    if(b.dataset.a==='next')st++;
    if(b.dataset.a==='back')st--;
    if(b.dataset.a==='restart'){st=0;sel=[];th=[];tp=null}
    if(st===1&&b.dataset.a==='back'){th=[];tp=null}
    if(st===2&&b.dataset.a==='back')tp=null;
    render();scrollTo(0,0);return;
  }
  const i=+b.dataset.i;msg='';
  const list=st===1?sel:th,max=st===1?5:3;
  if(st===3)tp=i;
  else if(list.includes(i))list.splice(list.indexOf(i),1);
  else if(list.length<max)list.push(i);
  else msg=`وصلت للحد الأقصى (${max}). شيل قيمة الأول علشان تختار غيرها.`;
  render(i);
});
render();
</script>
</body>
</html>
